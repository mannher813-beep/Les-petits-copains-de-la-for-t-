<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Atelier des Copains de la Forêt</title>
    <meta name="description" content="Suivi des défis et aventures pour les enfants de 5 à 7 ans, en complément du cahier imprimé." />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="L'Atelier des Copains de la Forêt" />
    <meta property="og:description" content="Suivi des défis et aventures pour les enfants de 5 à 7 ans, en complément du cahier imprimé." />
    <meta property="og:image" content="https://lescopainsdelaforet.pages.dev/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://lescopainsdelaforet.pages.dev" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card (repris par certains clients de messagerie) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="L'Atelier des Copains de la Forêt" />

    <meta name="theme-color" content="#2e7d46" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then((reg) => console.log("Service Worker registered successfully:", reg.scope))
            .catch((err) => console.warn("Service Worker registration failed:", err));
        });
      }
    </script>
  </body>
</html>
